<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>3D Plush Model</title>
    <style>
        body { margin: 0; background: #ffffff; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);

    const textureLoader = new THREE.TextureLoader();

    // 기본 재질 (텍스처가 로드되지 않을 경우를 대비)
    const defaultMaterial = new THREE.MeshPhongMaterial({
        color: 0xff9999,
        side: THREE.DoubleSide
    });

    const geometry = new THREE.SphereGeometry(1, 64, 64);
    const sphere = new THREE.Mesh(geometry, defaultMaterial);

    // 텍스처 로드 시도 (에러 처리 포함)
    textureLoader.load(
        'front.png',
        (texture) => {
            console.log('Front texture loaded');
            sphere.material = new THREE.MeshPhongMaterial({
                map: texture,
                side: THREE.DoubleSide
            });
        },
        undefined,
        (error) => {
            console.error('Error loading front texture:', error);
        }
    );

    scene.add(sphere);

    // 조명 추가
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const light = new THREE.DirectionalLight(0xffffff, 0.8);
    light.position.set(2, 2, 2);
    scene.add(light);

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
